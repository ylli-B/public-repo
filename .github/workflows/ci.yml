name: CI

# The public snapshot's own checks. The private repository runs a larger
# pipeline (dbt parse, web builds, terraform fmt, domain test suites); this is
# the subset that applies to the files published here.
on:
  push:
  pull_request:

jobs:
  checks:
    name: Secret scan, lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Scan tracked files for credentials
        run: python -m tools.leak_guard --secrets-only
      - name: Ruff
        run: ruff check .
      - name: Unit tests
        run: pytest -q tests/unit
      - name: Point-in-time / leakage tests
        run: pytest -q tests/leakage
